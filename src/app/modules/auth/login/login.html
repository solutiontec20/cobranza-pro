<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
  <!-- Error message -->
  @if (errorMessage()) {
  <div role="alert"
    class="flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700 dark:border-red-800/50 dark:bg-red-950/30 dark:text-red-400">
    <i class="pi pi-exclamation-triangle shrink-0" aria-hidden="true"></i>
    {{ errorMessage() }}
  </div>
  }

  <div pFocusTrap class="flex flex-col gap-1.5">

    <p-iconfield>
      <p-inputicon>
        <i class="pi pi-user"></i>
      </p-inputicon>
      <input type="text" pInputText id="input" formControlName="dni" type="text" placeholder="DNI" [fluid]="true" />
    </p-iconfield>

    <p-iconfield>
      <p-inputicon>
        <i class="pi pi-user"></i>
      </p-inputicon>
      <input type="text" pInputText id="input" formControlName="pin" type="password" inputmode="numeric"
        placeholder="••••" [fluid]="true" />
    </p-iconfield>


    <button pButton type="submit" class="w-full mt-2 justify-center font-bold py-3" [disabled]="loginForm.invalid">
      Ingresar
    </button>
  </div>
</form>

<!-- Quick Access Demo -->
<div class="mt-10">
  <div class="flex items-center gap-4 mb-5">
    <div class="h-px bg-surface-200 dark:bg-surface-700 flex-1"></div>
    <span class="text-xs font-semibold text-surface-400 uppercase tracking-widest">Demo rápido</span>
    <div class="h-px bg-surface-200 dark:bg-surface-700 flex-1"></div>
  </div>

  <div class="grid grid-cols-3 gap-3">
    <button type="button"
      class="flex flex-col items-center justify-center p-3 rounded-xl border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 hover:bg-surface-50 dark:hover:bg-surface-800 focus-visible:ring-2 focus-visible:ring-primary-500 transition-colors"
      (click)="quickLogin('prof-admin')">
      <div
        class="w-9 h-9 rounded-full bg-indigo-100 dark:bg-indigo-900/40 flex items-center justify-center text-indigo-600 dark:text-indigo-400 mb-1.5">
        <i class="pi pi-crown"></i>
      </div>
      <span class="text-xs font-bold text-surface-700 dark:text-surface-300">Admin</span>
      <span class="text-[10px] text-surface-400">Carlos M.</span>
    </button>

    <button type="button"
      class="flex flex-col items-center justify-center p-3 rounded-xl border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 hover:bg-surface-50 dark:hover:bg-surface-800 focus-visible:ring-2 focus-visible:ring-primary-500 transition-colors"
      (click)="quickLogin('prof-cobrador-1')">
      <div
        class="w-9 h-9 rounded-full bg-emerald-100 dark:bg-emerald-900/40 flex items-center justify-center text-emerald-600 dark:text-emerald-400 mb-1.5">
        <i class="pi pi-motorcycle"></i>
      </div>
      <span class="text-xs font-bold text-surface-700 dark:text-surface-300">Cobrador A</span>
      <span class="text-[10px] text-surface-400">Pedro C.</span>
    </button>

    <button type="button"
      class="flex flex-col items-center justify-center p-3 rounded-xl border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 hover:bg-surface-50 dark:hover:bg-surface-800 focus-visible:ring-2 focus-visible:ring-primary-500 transition-colors"
      (click)="quickLogin('prof-cobrador-2')">
      <div
        class="w-9 h-9 rounded-full bg-orange-100 dark:bg-orange-900/40 flex items-center justify-center text-orange-600 dark:text-orange-400 mb-1.5">
        <i class="pi pi-motorcycle"></i>
      </div>
      <span class="text-xs font-bold text-surface-700 dark:text-surface-300">Cobrador B</span>
      <span class="text-[10px] text-surface-400">Luis Q.</span>
    </button>
  </div>
</div>
