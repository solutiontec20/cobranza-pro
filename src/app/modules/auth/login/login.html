<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
  @if (successMessage()) {
  <div role="status"
    class="flex items-center gap-2 rounded-lg border border-green-200 bg-green-50 p-3 text-sm text-green-700 dark:border-green-800/50 dark:bg-green-950/30 dark:text-green-300">
    <i class="pi pi-check-circle shrink-0" aria-hidden="true"></i>
    <span>{{ successMessage() }}</span>
  </div>
  }

  <!-- Error message -->
  @if (errorMessage()) {
  <div role="alert"
    class="flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700 dark:border-red-800/50 dark:bg-red-950/30 dark:text-red-400">
    <i class="pi pi-exclamation-triangle shrink-0" aria-hidden="true"></i>
    <span>{{ errorMessage() }}</span>
  </div>
  }

  <div class="flex flex-col gap-3">
    <!-- DNI -->
    <div>
      <p-iconfield>
        <p-inputicon>
          <i class="pi pi-id-card"></i>
        </p-inputicon>
        <input
          pInputText
          id="dni"
          formControlName="dni"
          type="text"
          inputmode="numeric"
          maxlength="8"
          (keydown)="onNumericKeyDown($event)"
          (input)="onNumericInput($event, 'dni')"
          placeholder="DNI (8 dígitos)"
          [fluid]="true"
        />
      </p-iconfield>
    </div>

    <!-- PIN con toggle mostrar/ocultar y bloqueo de letras -->
    <div class="relative">
      <p-iconfield>
        <p-inputicon>
          <i class="pi pi-lock"></i>
        </p-inputicon>
        <input
          pInputText
          id="pin"
          formControlName="pin"
          [type]="showPin() ? 'text' : 'password'"
          inputmode="numeric"
          maxlength="6"
          (keydown)="onNumericKeyDown($event)"
          (input)="onNumericInput($event, 'pin')"
          placeholder="PIN de 6 dígitos"
          [fluid]="true"
          class="pr-10"
        />
      </p-iconfield>
      <button
        type="button"
        (click)="showPin.set(!showPin())"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-surface-400 hover:text-surface-600 dark:hover:text-surface-200 transition-colors cursor-pointer p-1 flex items-center justify-center border-0 bg-transparent focus:outline-hidden"
        [attr.aria-label]="showPin() ? 'Ocultar PIN' : 'Mostrar PIN'">
        <i [class]="showPin() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
      </button>
    </div>

    <!-- Submit Button -->
    <button
      pButton
      type="submit"
      class="w-full mt-2 justify-center font-bold py-3"
      [loading]="loading()"
      [disabled]="loginForm.invalid || loading()">
      Ingresar
    </button>
  </div>
</form>
