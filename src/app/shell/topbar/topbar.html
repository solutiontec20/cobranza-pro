<div class="flex h-full items-center justify-between px-1 sm:px-2">
  <!-- Left side (Mobile Logo) -->
  <div class="flex items-center gap-3">

    <div class="flex items-center gap-2 md:hidden">
      <div class="app-brand-mark size-8! rounded-lg! shadow-sm!">
        <i class="pi pi-wallet text-sm text-white"></i>
      </div>
      <span class="font-extrabold tracking-tight text-primary">CobranzaPro</span>
    </div>
  </div>

  <!-- Right side Actions -->
  <div class="flex items-center gap-2 md:gap-3">
    <!-- Theme Toggle -->
    <button 
      pButton 
      [rounded]="true" 
      [text]="true" 
      class="app-icon-button flex h-10 w-10 items-center justify-center p-0" 
      (click)="themeService.toggleTheme()"
      pTooltip="Cambiar tema">
      <i [class]="themeService.isDark() ? 'pi pi-sun text-xl' : 'pi pi-moon text-xl'"></i>
    </button>

    <!-- Notification bell -->
    <div class="relative">
      <button pButton [rounded]="true" [text]="true" class="app-icon-button flex h-10 w-10 items-center justify-center p-0" pTooltip="Notificaciones">
        <i class="pi pi-bell text-xl"></i>
      </button>
      <span class="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-surface-0 dark:border-surface-900 pointer-events-none"></span>
    </div>

    <div class="h-8 w-px bg-surface-200 dark:bg-surface-700 hidden md:block mx-1"></div>

    <!-- User Profile Info Desktop -->
    <div class="mr-1 hidden flex-col items-end md:flex">
      <span class="text-sm font-bold text-surface-900 dark:text-surface-0">{{ authService.currentUser()?.fullName || 'Usuario' }}</span>
      <span class="mt-0.5 rounded-full bg-primary-50 px-2 py-0.5 text-[10px] font-bold capitalize text-primary-700 dark:bg-primary-950/40 dark:text-primary-300">{{ authService.currentUser()?.role || '' }}</span>
    </div>

    <button pButton [rounded]="true" [text]="true" class="app-icon-button ml-1 flex h-10 w-10 items-center justify-center p-0" pTooltip="Perfil de usuario">
      <i class="pi pi-user text-xl"></i>
    </button>
  </div>
</div>
