<div class="h-full px-4 flex items-center justify-between">
  <!-- Left side (Mobile Logo) -->
  <div class="flex items-center gap-3">

    <div class="md:hidden flex items-center gap-2">
      <div class="w-8 h-8 bg-primary-500 rounded-lg flex items-center justify-center shadow-sm">
        <i class="pi pi-wallet text-sm text-white"></i>
      </div>
      <span class="font-bold text-surface-900 dark:text-surface-0 tracking-tight">CobranzaPro</span>
    </div>
  </div>

  <!-- Right side Actions -->
  <div class="flex items-center gap-2 md:gap-3">
    <!-- Theme Toggle -->
    <button 
      pButton 
      [rounded]="true" 
      [text]="true" 
      class="text-surface-500 w-10 h-10 p-0 flex items-center justify-center" 
      (click)="themeService.toggleTheme()"
      pTooltip="Cambiar tema">
      <i [class]="themeService.isDark() ? 'pi pi-sun text-xl' : 'pi pi-moon text-xl'"></i>
    </button>

    <!-- Notification bell -->
    <div class="relative">
      <button pButton [rounded]="true" [text]="true" class="text-surface-500 w-10 h-10 p-0 flex items-center justify-center" pTooltip="Notificaciones">
        <i class="pi pi-bell text-xl"></i>
      </button>
      <span class="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-surface-0 dark:border-surface-900 pointer-events-none"></span>
    </div>

    <div class="h-8 w-px bg-surface-200 dark:bg-surface-700 hidden md:block mx-1"></div>

    <!-- User Profile Info Desktop -->
    <div class="hidden md:flex flex-col items-end mr-1">
      <span class="text-sm font-bold text-surface-900 dark:text-surface-0">{{ authService.currentUser()?.fullName || 'Usuario' }}</span>
      <span class="text-[10px] text-surface-500">{{ authService.currentUser()?.role || '' }}</span>
    </div>

    <button pButton [rounded]="true" [text]="true" class="text-surface-500 w-10 h-10 p-0 flex items-center justify-center ml-1" pTooltip="Perfil de usuario">
      <i class="pi pi-user text-xl"></i>
    </button>
  </div>
</div>
