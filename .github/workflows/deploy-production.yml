name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CobranzaPro
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.15.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Verify Edge Function lockfiles
        run: pnpm functions:check

      # ==========================================
      # SUPABASE DATABASE PROD
      # ==========================================

      - name: Preview database migrations
        run: pnpm supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply database migrations
        run: pnpm supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # ==========================================
      # SUPABASE EDGE FUNCTIONS PROD
      # ==========================================

      - name: Deploy Supabase Edge Functions
        run: >
          pnpm supabase functions deploy
          --project-ref "$SUPABASE_PROJECT_ID"
          --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_FUNCTIONS_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

      # ==========================================
      # ANGULAR
      # ==========================================

      - name: Build Angular
        run: pnpm build
        env:
          NG_APP_PRIMENG_UI_KEY: ${{ secrets.NG_APP_PRIMENG_UI_KEY }}
          NG_APP_SUPABASE_URL: ${{ vars.NG_APP_SUPABASE_URL }}
          NG_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NG_APP_SUPABASE_PUBLISHABLE_KEY }}

      # ==========================================
      # CLOUDFLARE
      # ==========================================

      - name: Deploy Cloudflare
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ==========================================
      # PRODUCTION SMOKE TEST
      # ==========================================

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Production smoke test
        run: pnpm exec playwright test e2e/auth/login.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: https://cobranza-pro.cobranzapro01.workers.dev
