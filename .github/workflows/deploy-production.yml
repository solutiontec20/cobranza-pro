name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CobranzaPro
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24.15.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Build Angular
        run: pnpm build
        env:
          NG_APP_PRIMENG_UI_KEY: ${{ secrets.NG_APP_PRIMENG_UI_KEY }}
          NG_APP_SUPABASE_URL: ${{ vars.NG_APP_SUPABASE_URL }}
          NG_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NG_APP_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy Cloudflare
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
