name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CobranzaPro
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment: Production

    env:
      NG_APP_PRIMENG_UI_KEY: ${{ secrets.NG_APP_PRIMENG_UI_KEY }}
      NG_APP_SUPABASE_URL: ${{ vars.NG_APP_SUPABASE_URL }}
      NG_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NG_APP_SUPABASE_PUBLISHABLE_KEY }}

      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24.15.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm ci

      # ==========================================
      # SUPABASE PROD
      # ==========================================

      - name: Link Supabase Production
        run: pnpm supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview database migrations
        run: pnpm supabase db push --dry-run

      - name: Apply database migrations
        run: pnpm supabase db push

      # ==========================================
      # ANGULAR
      # ==========================================

      - name: Build Angular
        run: pnpm build

      # ==========================================
      # CLOUDFLARE
      # ==========================================

      - name: Deploy Cloudflare
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ==========================================
      # PRODUCTION SMOKE TEST
      # ==========================================

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Production smoke test
        run: pnpm exec playwright test e2e/login.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: https://cobranza-pro.cobranzapro01.workers.dev
