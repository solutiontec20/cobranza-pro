name: Deploy DEV

on:
  push:
    branches:
      - dev

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy DEV Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: Development

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.15.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm ci

      - name: Build Angular DEV
        run: pnpm build
        env:
          NG_APP_PRIMENG_UI_KEY: ${{ secrets.NG_APP_PRIMENG_UI_KEY }}
          NG_APP_SUPABASE_URL: ${{ vars.NG_APP_SUPABASE_URL }}
          NG_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NG_APP_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy DEV Preview
        run: pnpm wrangler preview --name dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
